services:
  db:
    image: postgres:17
    container_name: odoo19-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data/pgdata
    networks:
      - odoo-network

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo19
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./enterprise-19.0:/mnt/enterprise-addons
      - ./custom-addons:/mnt/custom-addons
    command:
      - odoo
      - --config=/etc/odoo/odoo.conf
    networks:
      - odoo-network

volumes:
  postgres-data:
  odoo-data:

networks:
  odoo-network:
    driver: bridge
